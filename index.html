<title>호떡 철권</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap">
<style>
/* 전체 화면 아이소메트릭 아케이드: WebGL 캔버스가 화면을 꽉 채우고, 그 위에 DOM HUD·패드·패널을 얹는다. 단일 다크 테마 */
:root{
  --bg:#0b111a; --panel:rgba(9,14,24,.86); --ink:#f6eee0; --muted:#a6b4c6;
  --accent:#ff6f91; --gold:#ffcc4d; --line:rgba(255,255,255,.14);
  --sl:max(16px,env(safe-area-inset-left,0px)); --sr:max(16px,env(safe-area-inset-right,0px));
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px); --padh:166px;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ui:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#view{--u:1px;position:fixed;inset:0;background:#0a1018;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
[hidden]{display:none!important}

/* ---- 터치 패드 (화면 위에 떠 있음) ---- */
#pad{display:none;position:fixed;left:0;right:0;bottom:0;padding:0 var(--sr) calc(12px + var(--sb)) var(--sl);justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
body.touch #pad{display:flex}
.cluster{display:grid;grid-template-columns:repeat(3,auto);gap:10px;align-items:center;justify-items:center;pointer-events:auto}
.act.poo{background:rgba(92,62,32,.75);border-color:#b58a5a;color:#ffe9c8}
.act.poo.ready{background:#8a5a2b;border-color:#ffd9a8;color:#fff;animation:pulse 1s ease-in-out infinite}
.act.psh{background:rgba(96,74,40,.75);border-color:#d1a86a}
.pbtn{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,14,24,.45);color:#fff;
  font:22px var(--ui);touch-action:none;-webkit-tap-highlight-color:transparent;padding:0;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pbtn.on{background:rgba(255,255,255,.4);transform:scale(.94)}
.act{width:64px;height:64px;font-size:17px}
.act.jmp{background:rgba(70,80,60,.7);border-color:#9aa67a}
.stick{position:relative;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(10,14,24,.35);pointer-events:auto;touch-action:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.stick .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(255,255,255,.6);box-sizing:border-box}
.stick .knob::after{content:'';position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.act.bite{background:rgba(110,52,38,.75);border-color:#c97a60}
.act.scr{background:rgba(47,74,94,.75);border-color:#7fb0d0}
.act.sp{background:rgba(46,37,56,.7);border-color:#6b5a80;color:#a99bbd}
.act.sp.ready{background:var(--accent);border-color:#ffd1dc;color:#2a0d16;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,111,145,.3)}}

/* ---- 전체화면 버튼 ---- */
#fsBtn{position:fixed;right:var(--sr);top:calc(10px + var(--st));z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,24,.5);color:#fff;font:18px var(--ui);cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#fsBtn:hover{background:rgba(255,255,255,.2)}

/* ---- HUD (가상 960px 기준, --u = 화면 크기에서 계산) ---- */
.hud{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*18);color:#fff}
.hud .top{position:absolute;left:var(--sl);right:calc(var(--sr) + 48px);top:calc(var(--u)*12 + var(--st));display:flex;align-items:flex-start;gap:calc(var(--u)*12)}
.hud .side{flex:1;min-width:0}
.hud .hp{position:relative;height:calc(var(--u)*22);background:rgba(10,8,12,.72);border-radius:calc(var(--u)*7);overflow:hidden;border:calc(var(--u)*2) solid rgba(255,255,255,.3);box-shadow:0 calc(var(--u)*3) calc(var(--u)*10) rgba(0,0,0,.4)}
.hud .fill,.hud .lag{position:absolute;inset:0;transform-origin:left center}
.hud .p2 .fill,.hud .p2 .lag{transform-origin:right center}
.hud .lag{background:#c0263c}
.hud .fill{background:linear-gradient(#ffe88c,#f0a21c);box-shadow:inset 0 calc(var(--u)*6) rgba(255,255,255,.3)}
.hud .fill.low{background:linear-gradient(#ff9d7a,#e0402d)}
.hud .nm{display:flex;align-items:center;gap:calc(var(--u)*10);margin-top:calc(var(--u)*5);font-size:calc(var(--u)*21);text-shadow:0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.7);white-space:nowrap}
.hud .p2 .nm{justify-content:flex-end}
.hud .dots{display:inline-flex;gap:calc(var(--u)*6)}
.hud .dots i{width:calc(var(--u)*12);height:calc(var(--u)*12);border-radius:50%;background:rgba(255,255,255,.22);border:calc(var(--u)*1) solid rgba(255,255,255,.4)}
.hud .dots i.won{background:var(--gold)}
.hud .mid{width:calc(var(--u)*110);flex:none;text-align:center}
.hud .timer{width:calc(var(--u)*60);height:calc(var(--u)*60);margin:0 auto;border-radius:50%;background:rgba(10,8,12,.78);border:calc(var(--u)*2) solid rgba(255,255,255,.35);
  font-family:var(--display);font-size:calc(var(--u)*30);line-height:calc(var(--u)*58);font-variant-numeric:tabular-nums}
.hud .timer.low{color:#ff8a6b}
.hud .stg{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*14);color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
.hud .bottom{position:absolute;left:var(--sl);right:var(--sr);bottom:calc(var(--u)*14 + var(--sb));display:flex;justify-content:space-between;gap:calc(var(--u)*20)}
body.touch .hud .bottom{bottom:calc(var(--u)*10 + var(--padh) + var(--sb))}
.hud .meter{width:calc(var(--u)*260);max-width:42%}
.hud .lbl{font-size:calc(var(--u)*16);color:rgba(255,255,255,.75);margin-bottom:calc(var(--u)*3);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .p2 .lbl{text-align:right}
.hud .meter.ready .lbl{color:var(--mc,#ffcc4d)}
.hud .bar{height:calc(var(--u)*11);background:rgba(10,8,12,.7);border-radius:calc(var(--u)*5);overflow:hidden;border:calc(var(--u)*1) solid rgba(255,255,255,.25)}
.hud .mf{height:100%;transform-origin:left center;background:var(--mc,#ffcc4d)}
.hud .p2 .mf{transform-origin:right center}
.hud .meter.ready .mf{animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(.8)}to{filter:brightness(1.4)}}
.hud .poo{display:flex;align-items:center;gap:calc(var(--u)*5);margin-top:calc(var(--u)*6);font-size:calc(var(--u)*14);color:rgba(255,255,255,.7);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
.hud .poo i{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;background:rgba(0,0,0,.4);border:calc(var(--u)*1) solid rgba(255,255,255,.4)}
.hud .poo i.on{background:#8a5a2b;border-color:#e4b47a}
.hud .p2 .poo{justify-content:flex-end}
.hud .poo.ready span{color:#ffd9a8}
.hud .poo.ready i{animation:glow .5s ease-in-out infinite alternate}
.hud .combo{position:absolute;top:calc(var(--u)*118 + var(--st));font-family:var(--display);font-size:calc(var(--u)*34);color:var(--gold);-webkit-text-stroke:calc(var(--u)*1.5) #1d0c14;text-shadow:0 calc(var(--u)*3) 0 #1d0c14;opacity:0;transition:opacity .25s}
.hud .combo.p1{left:calc(var(--sl) + var(--u)*14)}
.hud .combo.p2{right:calc(var(--sr) + var(--u)*14)}
.hud .combo.show{opacity:1}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none}
.banner span{display:inline-block;font-family:var(--display);font-size:calc(var(--u)*86);line-height:1.1;color:#fff;
  -webkit-text-stroke:calc(var(--u)*2.5) #1d0c14;paint-order:stroke fill;text-shadow:0 calc(var(--u)*6) 0 #1d0c14,0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.6);
  animation:bpop .35s cubic-bezier(.2,1.6,.4,1) both}
.banner span.hot{background:linear-gradient(#ffe6ee,#ff6f91);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 calc(var(--u)*5) 0 #5a1830)}
.banner span.ko{font-size:calc(var(--u)*124);background:linear-gradient(#ffffff,#ff5a5a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 calc(var(--u)*6) 0 #3a0a0a)}
.banner span.out{animation:bout .3s ease-in forwards}
@keyframes bpop{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bout{to{transform:scale(.8);opacity:0}}
#vs{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--display);font-size:calc(var(--u)*96);color:#fff;pointer-events:none;
  -webkit-text-stroke:calc(var(--u)*3) #1d0c14;paint-order:stroke fill;text-shadow:0 calc(var(--u)*6) 0 #c2405f;animation:vsbeat 1.1s ease-in-out infinite}
@keyframes vsbeat{50%{transform:scale(1.06)}}
#cutin{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;padding-bottom:calc(var(--u)*78 + var(--sb));box-sizing:border-box;pointer-events:none;overflow:hidden}
body.touch #cutin{padding-bottom:calc(var(--u)*70 + var(--padh) + var(--sb))}
#cutin .band{width:100%;padding:calc(var(--u)*16) calc(var(--sr) + var(--u)*24) calc(var(--u)*18) calc(var(--sl) + var(--u)*24);background:linear-gradient(100deg,var(--mc,#ff6f91),rgba(0,0,0,.6));clip-path:polygon(0 14%,100% 0,100% 86%,0 100%);
  animation:slide .32s cubic-bezier(.2,.9,.3,1) both;box-sizing:border-box}
#cutin.p2 .band{background:linear-gradient(260deg,var(--mc,#ff6f91),rgba(0,0,0,.6));animation-name:slideR}
#cutin .who{font-size:calc(var(--u)*22);color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.7)}
#cutin .mv{font-family:var(--display);font-size:calc(var(--u)*66);line-height:1.1;color:#fff;-webkit-text-stroke:calc(var(--u)*2) #1d0c14;paint-order:stroke fill;text-shadow:0 calc(var(--u)*5) 0 #1d0c14}
#cutin.p1 .band{text-align:right}
#cutin.p2 .band{text-align:left}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideR{from{transform:translateX(100%)}to{transform:none}}

/* ---- 패널 ---- */
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:calc(14px + var(--st)) var(--sr) calc(14px + var(--sb)) var(--sl);box-sizing:border-box}
#ui[data-pos="left"]{justify-content:flex-start}
#ui[data-pos="top"]{align-items:flex-start}
#ui[data-pos="bottom"]{align-items:flex-end}
#ui[data-pos="bottom"] .panel{max-width:620px}
.talk{display:flex;gap:14px;align-items:center;text-align:left;min-height:84px}
.talk .tface{width:78px;height:78px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.25),rgba(255,255,255,.05) 70%);border:2px solid var(--gold)}
.talk .tbody b{font:20px var(--display);color:var(--gold);font-weight:400}
.talk .tbody p{margin:4px 0 0;font-size:17px;line-height:1.55;min-height:3.1em}
.talk.nar .tbody p{font-style:italic;color:var(--muted);text-align:center}
.talk.nar{justify-content:center}
@media (max-width:560px){.talk .tface{width:58px;height:58px}.talk .tbody p{font-size:15px}}
body.touch #ui{padding-bottom:calc(var(--padh) + 4px + var(--sb))}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;
  max-width:440px;width:100%;box-sizing:border-box;text-align:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-height:100%;overflow:auto}
.eyebrow{margin:0;font-size:14px;letter-spacing:.14em;color:var(--gold)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,74px);line-height:1;margin:6px 0 4px;color:#fff;
  text-shadow:0 4px 0 #c2405f,0 8px 22px rgba(0,0,0,.5);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:6px 0 2px;text-wrap:balance}
h2 small{display:block;font-family:var(--ui);font-size:16px;color:var(--muted);margin-top:4px}
.lede{margin:6px auto 0;max-width:34ch;line-height:1.5;font-size:17px}
.move{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:left;line-height:1.45;font-size:16px}
.move b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:19px;display:block}
.fact{margin:10px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.primary,.secondary{font:21px var(--display);border-radius:999px;padding:11px 30px;cursor:pointer;border:0}
.primary{background:var(--accent);color:#2a0d16}
.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.howto{margin:14px 0 0;font-size:15px;color:var(--muted);line-height:1.6}
.howto b{color:var(--ink);font-weight:400;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.snd{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:15px;color:var(--muted);cursor:pointer}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.pick button{font:16px var(--ui);padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
.pick button:hover{background:rgba(255,255,255,.14)}
.pick button.sel{background:var(--accent);color:#2a0d16;border-color:#ffd1dc}
.pick button.sel2{background:#5fb0ff;color:#0b1a2a;border-color:#cfe8ff}
.pick small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pick img.face{display:block;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.22),rgba(255,255,255,.04) 70%);pointer-events:none}
@media (max-width:560px){.pick img.face{width:46px;height:46px}}
.skills{margin:10px 0 2px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:left;font-size:14px;line-height:1.5}
.skills b{font:18px var(--display);color:var(--gold);font-weight:400}
.skills p{margin:4px 0 0;color:var(--ink)}
.skills span{display:inline-block;font-size:12px;padding:0 6px;margin-right:6px;border-radius:5px;background:var(--accent);color:#2a0d16}
.skills p+p span{background:#8fd3ff;color:#0b1a2a}
.row.lv{margin:6px 0 2px;align-items:center}.row.lv button{padding:6px 18px;font-size:17px;min-width:56px}.row.lv .lvl{font:15px var(--ui);color:var(--muted);margin-right:4px}
@media (max-height:720px){.pick{gap:6px;margin-top:8px}.pick button{padding:5px 3px;font-size:14px}.pick img.face{width:40px;height:40px;margin-bottom:2px}.pick small{font-size:11px}.skills{margin-top:6px;padding:7px 10px;font-size:13px}.skills b{font-size:16px}}
.pick.hero{grid-template-columns:repeat(3,1fr);max-width:420px;margin-left:auto;margin-right:auto}
.pick.hero img.face{width:92px;height:92px}
.pick.hero button{font-size:19px;padding:12px 6px}
.pick button.sel small,.pick button.sel2 small{color:inherit;opacity:.8}
.keys2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;text-align:left;font-size:14px;line-height:1.6;color:var(--muted)}
.keys2 b{color:var(--ink);font-weight:400;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.keys2 h4{margin:0 0 4px;font:17px var(--display);color:var(--gold)}
.code{font:34px var(--display);letter-spacing:.3em;color:var(--gold);margin:8px 0}
.panel textarea.codebox{display:block;width:min(440px,78vw);height:70px;margin:0 auto;padding:8px;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:none;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink)}
.panel textarea.codebox::placeholder{color:var(--muted);font:14px var(--ui)}
.panel input.txt{font:22px var(--display);letter-spacing:.25em;text-transform:uppercase;width:7ch;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink)}
#nogl{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);line-height:1.6}
@media (max-height:480px){:root{--padh:118px}.stick{width:104px;height:104px}.stick .knob{width:44px;height:44px;margin:-22px 0 0 -22px}.stick .knob::after{inset:12px}.act{width:50px;height:50px;font-size:14px}.cluster{gap:8px}}
@media (prefers-reduced-motion:reduce){.act.sp.ready,.hud .meter.ready .mf,#vs{animation:none}}
</style>

<div id="view">
  <canvas id="cv" aria-label="호떡 철권 3D 게임 화면"></canvas>
  <div id="hud" class="hud" hidden>
    <div class="top">
      <div class="side p1"><div class="hp"><div class="lag" id="lag1"></div><div class="fill" id="hp1"></div></div><div class="nm"><span id="n1">호떡</span><span class="dots" id="d1"><i></i><i></i></span></div></div>
      <div class="mid"><div class="timer" id="timer">60</div><div class="stg" id="stg"></div></div>
      <div class="side p2"><div class="hp"><div class="lag" id="lag2"></div><div class="fill" id="hp2"></div></div><div class="nm"><span class="dots" id="d2"><i></i><i></i></span><span id="n2"></span></div></div>
    </div>
    <div class="combo p1" id="c1"></div><div class="combo p2" id="c2"></div>
    <div class="banner" id="banner"></div>
    <div class="bottom">
      <div class="meter p1" id="mt1"><div class="lbl" id="ml1">기력</div><div class="bar"><div class="mf" id="m1"></div></div><div class="poo" id="poo"><i></i><i></i><i></i><span>똥 미사일 · 공격 3번마다</span></div></div>
      <div class="meter p2" id="mt2"><div class="lbl" id="ml2">기력</div><div class="bar"><div class="mf" id="m2"></div></div><div class="poo" id="poo2"><span>보조기</span><i></i><i></i><i></i></div></div>
    </div>
  </div>
  <div id="vs" hidden>VS</div>
  <div id="cutin" hidden><div class="band"><div class="who" id="cwho"></div><div class="mv" id="cmv"></div></div></div>
  <div id="ui"></div>
  <div id="nogl">이 기기에서는 3D 화면(WebGL)을 켤 수 없습니다.<br>다른 브라우저나 기기에서 열어 주세요.</div>
</div>
<button id="fsBtn" type="button" title="전체화면" aria-label="전체화면 전환" hidden>⛶</button>
<div id="pad" aria-hidden="true">
  <div id="stick" class="stick"><div class="knob" id="knob"></div></div>
  <div class="cluster">
    <button class="pbtn act jmp" data-k="jump">점프</button>

function furTex(sp){return tex(256,256,(g,w,h)=>{
 const R=rng(11);
 let gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,mix(sp.col.base,sp.col.dark,.4));gr.addColorStop(.42,sp.col.base);gr.addColorStop(.78,sp.col.light);gr.addColorStop(1,sp.col.belly);

 for(let i=0;i<500;i++){g.fillStyle=R()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';g.fillRect(R()*w,R()*h,1.5,3+R()*5)}
 if(sp.pattern==='curly'){for(let i=0;i<420;i++){const x=R()*w,y=R()*h,r=3+R()*4;g.strokeStyle=R()<.5?'rgba(150,130,110,.28)':'rgba(255,255,255,.55)';g.lineWidth=1.6;g.beginPath();g.arc(x,y,r,R()*TAU,R()*TAU+4);g.stroke()}}   // 푸들 곱슬
 if(sp.pattern==='brindleDark'){for(let i=0;i<60;i++){const x=R()*w;g.strokeStyle=i%4?'rgba(0,0,0,.55)':'rgba(140,105,70,.3)';g.lineWidth=3+R()*6;g.beginPath();g.moveTo(x,0);for(let y=0;y<=h*.84;y+=8)g.lineTo(x+Math.sin(y*.05+i)*7,y);g.stroke()}
  g.fillStyle='rgba(190,180,168,.16)';g.fillRect(0,h*.88,w,h*.12)}   // 짱이: 거의 검은 호랑이 무늬, 주둥이·발끝만 희끗
 if(sp.pattern==='brindle'){for(let i=0;i<46;i++){const x=R()*w;g.strokeStyle=i%3?'rgba(28,16,8,.6)':'rgba(215,170,110,.32)';g.lineWidth=3+R()*5;g.beginPath();g.moveTo(x,0);for(let y=0;y<=h*.82;y+=8)g.lineTo(x+Math.sin(y*.05+i)*7,y);g.stroke()}
  g.fillStyle='rgba(235,225,210,.35)';g.fillRect(0,h*.86,w,h*.14)}
 if(sp.pattern==='tabby'){for(let i=0;i<14;i++){const x=i*w/14+R()*8;g.strokeStyle='rgba(125,62,20,.65)';g.lineWidth=7;g.beginPath();g.moveTo(x,0);g.quadraticCurveTo(x+12,h*.3,x,h*.64);g.stroke()}}
 if(sp.pattern==='spots'){g.fillStyle='rgba(252,246,232,.92)';for(let i=0;i<80;i++){g.beginPath();g.arc(R()*w,R()*h*.62,3+R()*4,0,TAU);g.fill()}}
 if(sp.pattern==='bristle'){for(let i=0;i<90;i++){const x=R()*w;g.strokeStyle=i%2?'rgba(10,6,4,.5)':'rgba(140,120,100,.25)';g.lineWidth=1.5+R()*2.5;g.beginPath();g.moveTo(x,R()*h*.3);g.lineTo(x+(R()-.5)*6,h*.5+R()*h*.4);g.stroke()}}
 if(sp.pattern==='sleek'){for(let i=0;i<70;i++){const x=R()*w;g.strokeStyle=i%3?'rgba(255,255,255,.09)':'rgba(0,0,0,.16)';g.lineWidth=1+R()*1.6;g.beginPath();g.moveTo(x,R()*h*.2);g.lineTo(x+(R()-.5)*10,h*.5+R()*h*.45);g.stroke()}
  gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.3,'rgba(255,255,255,.1)');gr.addColorStop(.5,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}   // 수달: 물에 젖은 듯 매끈한 윤기

   해안선은 밀려왔다 빠지는 거품 띠(가장자리 레이스), 앞바다에 부서지는 파도 줄 하나 더. 파도 높이는 GPU에서 계산. */
const SEA_UP=4;   // 물 판을 모래 쪽으로 이만큼 더 깔아 두고 물가선 밖은 버린다(밀려오는 물이 모래 위로 올라옴)
const seaGeo=new THREE.PlaneGeometry(SEA_W,SEA_D+SEA_UP,SEA_SX,SEA_SZ+2);seaGeo.rotateX(-Math.PI/2);
const seaU=THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{uT:{value:0},uAmp:{value:1},uFoam:{value:1},uShallow:{value:new THREE.Color()},uNear:{value:new THREE.Color()},uFar:{value:new THREE.Color()},uSand:{value:new THREE.Color()},uHalf:{value:(SEA_D+SEA_UP)/2}}]);
const seaMat=new THREE.ShaderMaterial({uniforms:seaU,fog:true,transparent:true,depthWrite:false,
 vertexShader:`uniform float uT,uAmp,uHalf;varying vec2 vP;varying float vD;
  #include <fog_pars_vertex>
  void main(){vec3 p=position;vD=(uHalf-p.z)-${SEA_UP.toFixed(1)};vP=p.xz;float k=clamp(vD/30.,0.,1.);
   p.y+=(sin(p.x*.5+uT*1.1)*.05+sin(p.z*.7-uT*1.4)*.1+sin((p.x+p.z)*.25+uT*.6)*.05)*(1.+k*.9)*uAmp*smoothstep(1.,6.,vD)+.04+.5*smoothstep(0.,6.,vD);   // 모래보다 항상 위
   vec4 mvPosition=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mvPosition;
   #include <fog_vertex>
  }`,
 fragmentShader:`uniform float uT,uAmp,uFoam;uniform vec3 uShallow,uNear,uFar,uSand;varying vec2 vP;varying float vD;
  #include <fog_pars_fragment>
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  void main(){float x=vP.x,d=vD,t=uT;
   float sw=uFoam*(1.1*sin(t*.55)+.25*sin(x*.31+t*.9)+.18*sin(x*.83-t*.7)+.35)-.2;   // 밀려왔다 빠지는 물가선(모래 쪽이 음수)
   if(d<sw)discard;
   float dd=d-sw;
   vec3 col=mix(uShallow,uNear,smoothstep(.2,5.,dd));col=mix(col,uFar,smoothstep(6.,46.,d));
   col=mix(uSand,col,smoothstep(0.,.9,dd)*.5+.5);   // 아주 얕은 곳은 모래가 비친다
   // 물결 무늬: 흐르는 노이즈를 등고선처럼 잘라 밝은 결을 만든다
   vec2 q=vec2(x*.55,d*1.1);float w=n(q+vec2(t*.25,-t*.35))*.6+n(q*2.1-vec2(t*.4,t*.2))*.4;
   float lines=smoothstep(.035,0.,abs(fract(w*4.)-.5)-.44)*(1.-smoothstep(10.,40.,d));
   col=mix(col,vec3(1.),lines*.13);
   // 반짝임
   float g=n(vec2(x*3.,d*5.)+vec2(t*.9,0.));col+=vec3(1.)*smoothstep(.88,.97,g)*.3*(1.-smoothstep(4.,30.,d));
   // 물가 거품 띠 + 레이스
   float lace=n(vec2(x*2.2,dd*3.-t*.8));
   float fo=uFoam*(1.-smoothstep(0.,.45+lace*.35,dd));
   fo=max(fo,uFoam*smoothstep(.62,.7,lace)*(1.-smoothstep(.4,1.6,dd))*.8);
   // 앞바다 부서지는 파도 줄
   float br=4.2+.8*sin(t*.55+1.5)+.4*sin(x*.27+t*.5);float bk=uFoam*(1.-smoothstep(0.,.18+n(vec2(x*1.4,t*.3))*.3,abs(d-br)))*smoothstep(.35,.75,n(vec2(x*.9,t*.5)));
   col=mix(col,vec3(1.),clamp(max(fo,bk*.8),0.,1.));
   float a=mix(.72,1.,smoothstep(0.,2.5,dd));a=max(a,fo);
   gl_FragColor=vec4(col,a);
   #include <tonemapping_fragment>
   #include <encodings_fragment>
   #include <fog_fragment>
  }`});

  timer=setInterval(()=>{shown+=1;el.textContent=l.txt.slice(0,shown);if(shown>=l.txt.length)clearInterval(timer)},28);

const PORTRAIT={};
function portrait(key){
 if(PORTRAIT[key])return PORTRAIT[key];
 const W=144,sp=SP[key],rig=buildAnimal(sp),sc=new THREE.Scene();sc.add(rig.root);
 sc.add(new THREE.HemisphereLight(0xfff6ea,0x8a7a6e,1.1));const dl=new THREE.DirectionalLight(0xffffff,.95);dl.position.set(1.2,2.4,2.4);sc.add(dl);
 const fill=new THREE.DirectionalLight(0xdde8ff,.35);fill.position.set(-2,.5,1);sc.add(fill);
 const p=basePose();p.mouth=.32;p.tongue=key==='hotteok'||key==='jjang';p.headDY=-3;p.headYaw=.0;
 applyPose(rig,p,{state:'idle'},true,{});
 rig.root.rotation.y=-.6;rig.root.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(rig.head),ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
 const dir=new THREE.Vector3(.68,.22,.7).normalize(),d=Math.max(sz.x,sz.y,sz.z)*2.6;
 const cam=new THREE.PerspectiveCamera(26,1,.01,200);cam.position.copy(ctr).addScaledVector(dir,d);cam.lookAt(ctr);
 const rt=new THREE.WebGLRenderTarget(W,W,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});rt.texture.encoding=THREE.sRGBEncoding;
 const prevC=renderer.getClearColor(new THREE.Color()),prevA=renderer.getClearAlpha();
 renderer.setClearColor(0x000000,0);renderer.setRenderTarget(rt);renderer.clear();renderer.render(sc,cam);
 const buf=new Uint8Array(W*W*4);renderer.readRenderTargetPixels(rt,0,0,W,W,buf);renderer.setRenderTarget(null);renderer.setClearColor(prevC,prevA);
 const c=document.createElement('canvas');c.width=c.height=W;const g=c.getContext('2d'),img=g.createImageData(W,W);
 for(let y=0;y<W;y++)img.data.set(buf.subarray((W-1-y)*W*4,(W-y)*W*4),y*W*4);g.putImageData(img,0,0);
 rt.dispose();disposeRig(rig);
 return PORTRAIT[key]=c.toDataURL();
}
